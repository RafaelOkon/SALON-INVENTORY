<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Categories - Salon Inventory Management System</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body class="dashboard-page categories-page">


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container-fluid">

            <a
                class="navbar-brand fw-bold"
                href="dashboard.html"
            >
                <i class="bi bi-box-seam"></i>
                Salon Inventory
            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#categoriesNavbar"
                aria-controls="categoriesNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="categoriesNavbar"
            >

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="dashboard.html"
                        >
                            Dashboard
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="products.html"
                        >
                            Products
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="categories.html"
                        >
                            Categories
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="suppliers.html"
                        >
                            Suppliers
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="stock.html"
                        >
                            Stock
                        </a>

                    </li>


                    <li class="nav-item ms-lg-3">

                        <button
                            class="btn btn-outline-light btn-sm"
                            id="logoutButton"
                        >

                            <i class="bi bi-box-arrow-right"></i>
                            Logout

                        </button>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="container-fluid px-3 px-md-4 py-4">


        <!-- PAGE HEADER -->

        <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4"
        >

            <div>

                <h1 class="fw-bold mb-1">
                    Categories
                </h1>

                <p class="text-muted mb-0">
                    Organize your salon and beauty products into categories.
                </p>

            </div>


            <div class="mt-3 mt-md-0">

                <button
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#addCategoryModal"
                >

                    <i class="bi bi-plus-circle"></i>
                    Add Category

                </button>

            </div>

        </div>



        <!-- =========================
             SEARCH
        ========================== -->

        <div class="card border-0 shadow-sm mb-4">

            <div class="card-body">

                <div class="row g-3 align-items-end">

                    <div class="col-12 col-md-8 col-lg-6">

                        <label
                            for="categorySearch"
                            class="form-label fw-semibold"
                        >
                            Search Categories
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>

                            <input
                                type="search"
                                class="form-control"
                                id="categorySearch"
                                placeholder="Search category..."
                            >

                        </div>

                    </div>


                    <div class="col-12 col-md-4 col-lg-2">

                        <button
                            type="button"
                            class="btn btn-outline-secondary w-100"
                            id="resetCategorySearch"
                        >

                            <i class="bi bi-arrow-counterclockwise"></i>
                            Reset

                        </button>

                    </div>

                </div>

            </div>

        </div>



        <!-- =========================
             CATEGORY TABLE
        ========================== -->

        <div class="card border-0 shadow-sm">

            <div class="card-header bg-white py-3">

                <div class="d-flex justify-content-between align-items-center">

                    <h5 class="fw-bold mb-0">
                        Category List
                    </h5>

                    <span
                        class="badge text-bg-secondary"
                        id="categoryCount"
                    >
                        6 Categories
                    </span>

                </div>

            </div>


            <div class="card-body p-0">

                <div class="table-responsive">

                    <table
                        class="table table-hover align-middle mb-0"
                        id="categoriesTable"
                    >

                        <thead class="table-light">

                            <tr>

                                <th>#</th>

                                <th>Category Name</th>

                                <th>Description</th>

                                <th>Products</th>

                                <th>Status</th>

                                <th class="text-end">
                                    Actions
                                </th>

                            </tr>

                        </thead>

<tbody id="categoriesTableBody">

    <tr>
        <td colspan="6" class="text-center py-4">
            Loading categories...
        </td>
    </tr>

</tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>



    <!-- =========================
         ADD CATEGORY MODAL
    ========================== -->

    <div
        class="modal fade"
        id="addCategoryModal"
        tabindex="-1"
        aria-labelledby="addCategoryModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title fw-bold"
                        id="addCategoryModalLabel"
                    >
                        Add New Category
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <div class="modal-body">

                    <form id="categoryForm">

                        <div class="mb-3">

                            <label
                                for="categoryName"
                                class="form-label fw-semibold"
                            >
                                Category Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="categoryName"
                                placeholder="Example: Hair Care"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="categoryDescription"
                                class="form-label fw-semibold"
                            >
                                Description
                            </label>

                            <textarea
                                class="form-control"
                                id="categoryDescription"
                                rows="4"
                                placeholder="Describe this category..."
                            ></textarea>

                        </div>


                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="categoryStatus"
                                checked
                            >

                            <label
                                class="form-check-label"
                                for="categoryStatus"
                            >
                                Category is active
                            </label>

                        </div>

                    </form>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        form="categoryForm"
                        class="btn btn-primary"
                    >

                        <i class="bi bi-plus-circle"></i>
                        Add Category

                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Custom JavaScript -->

    <script src="../js/api.js"></script>

    
    <script src="../js/categories.js"></script>

    <script src="../js/app.js"></script>


</body>

</html>
